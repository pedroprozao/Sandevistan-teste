
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SANDEVISTAN</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#05070d;font-family:Arial;color:white;touch-action:none}
canvas{display:block}
#menu{position:absolute;inset:0;background:radial-gradient(circle,#17202d,#03050a);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:5;text-align:center}
h1{font-size:42px;color:#00eaff;text-shadow:0 0 20px #00dfff;letter-spacing:5px;margin-bottom:5px}
#menu p{color:#aaa;margin-bottom:30px}
button{border:1px solid #00eaff;background:#07141d;color:#00eaff;padding:15px 28px;font-size:17px;font-weight:bold;border-radius:8px}
button:active{background:#00eaff;color:#000}
#hud{position:absolute;top:15px;left:15px;z-index:2;pointer-events:none}
#health{width:160px;height:12px;background:#333;margin-top:7px;border-radius:10px;overflow:hidden}
#healthbar{height:100%;width:100%;background:#00eaff}
#controls{position:absolute;bottom:25px;left:0;right:0;display:flex;justify-content:space-between;align-items:end;padding:0 25px;z-index:3}
#joy{width:115px;height:115px;border:2px solid #00eaff66;border-radius:50%;background:#00eaff18;position:relative;touch-action:none}
#stick{width:45px;height:45px;background:#00eaff99;border:2px solid #00eaff;border-radius:50%;position:absolute;left:33px;top:33px}
#actions{display:flex;gap:12px;align-items:end}
.action{width:75px;height:75px;border-radius:50%;padding:5px;font-size:12px}
#dash{border-color:#ff2c76;color:#ff2c76}
#slow{border-color:#00eaff;color:#00eaff}
#message{position:absolute;top:40%;width:100%;text-align:center;font-size:28px;color:#ff386f;display:none;z-index:4}
</style>
</head>
<body>

<div id="menu">
<h1>SANDEVISTAN</h1>
<p>O tempo está nas suas mãos.</p>
<button id="start">INICIAR</button>
</div>

<div id="hud">
<div>VIDA</div>
<div id="health"><div id="healthbar"></div></div>
<div id="stats">INIMIGOS: 5</div>
</div>

<div id="message">
VOCÊ FOI DERROTADO
<br><br>
<button onclick="location.reload()">REINICIAR</button>
</div>

<div id="controls">
<div id="joy"><div id="stick"></div></div>
<div id="actions">
<button class="action" id="slow">SLOW</button>
<button class="action" id="dash">DASH</button>
</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x050912);
scene.fog = new THREE.Fog(0x050912, 15, 55);

const camera = new THREE.PerspectiveCamera(70,innerWidth/innerHeight,0.1,100);
camera.position.set(0,9,13);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0x9eeeff,0x111122,2));
const light = new THREE.DirectionalLight(0xffffff,2);
light.position.set(5,12,5);
scene.add(light);

const floor = new THREE.Mesh(
new THREE.PlaneGeometry(100,100),
new THREE.MeshStandardMaterial({color:0x101a27,roughness:0.8})
);
floor.rotation.x=-Math.PI/2;
floor.position.y=-0.05;
scene.add(floor);

const grid = new THREE.GridHelper(100,50,0x00aacc,0x183344);
scene.add(grid);

const player = new THREE.Group();
const body = new THREE.Mesh(
new THREE.CylinderGeometry(0.38,0.38,1.1,16),
new THREE.MeshStandardMaterial({color:0x00dfff,emissive:0x003344})
);
body.position.y=0.85;
player.add(body);

const head = new THREE.Mesh(
new THREE.SphereGeometry(0.3,16,16),
new THREE.MeshStandardMaterial({color:0xffffff,emissive:0x225577})
);
head.position.y=1.55;
player.add(head);
scene.add(player);

const enemies=[];
const enemyMaterial=new THREE.MeshStandardMaterial({
color:0xff174f,emissive:0x660019
});

for(let i=0;i<5;i++){
const enemy=new THREE.Mesh(
new THREE.OctahedronGeometry(0.65),
enemyMaterial
);
enemy.position.set(
Math.cos(i*1.25)*8,0.8,
Math.sin(i*1.25)*8
);
scene.add(enemy);
enemies.push(enemy);
}

let running=false;
let health=100;
let slow=false;
let dashPower=0;
let hitCooldown=0;
let joyX=0,joyY=0;
let lastTime=0;

const startButton=document.getElementById("start");
startButton.addEventListener("click",()=>{
running=true;
document.getElementById("menu").style.display="none";
});

const slowButton=document.getElementById("slow");
slowButton.addEventListener("pointerdown",e=>{
e.preventDefault();slow=true;
});
["pointerup","pointercancel","pointerleave"].forEach(event=>{
slowButton.addEventListener(event,()=>slow=false);
});

document.getElementById("dash").addEventListener("click",()=>{
if(running) dashPower=0.65;
});

const joy=document.getElementById("joy");
const stick=document.getElementById("stick");
let joyActive=false;

function moveJoy(e){
const rect=joy.getBoundingClientRect();
let x=e.clientX-(rect.left+rect.width/2);
let y=e.clientY-(rect.top+rect.height/2);
const max=35;
const length=Math.hypot(x,y);
if(length>max){x=x/length*max;y=y/length*max;}
joyX=x/max;
joyY=y/max;
stick.style.left=(33+x)+"px";
stick.style.top=(33+y)+"px";
}

joy.addEventListener("pointerdown",e=>{
joyActive=true;
joy.setPointerCapture(e.pointerId);
moveJoy(e);
});
joy.addEventListener("pointermove",e=>{
if(joyActive)moveJoy(e);
});
function releaseJoy(){
joyActive=false;
joyX=0;joyY=0;
stick.style.left="33px";
stick.style.top="33px";
}
joy.addEventListener("pointerup",releaseJoy);
joy.addEventListener("pointercancel",releaseJoy);

const keys={};
window.addEventListener("keydown",e=>keys[e.key.toLowerCase()]=true);
window.addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);

function animate(time){
requestAnimationFrame(animate);
const delta=Math.min((time-lastTime)/1000,0.05);
lastTime=time;

if(running){
const timeScale=slow?0.22:1;
const speed=5*timeScale;

let x=joyX;
let z=joyY;

if(keys["w"]||keys["arrowup"])z-=1;
if(keys["s"]||keys["arrowdown"])z+=1;
if(keys["a"]||keys["arrowleft"])x-=1;
if(keys["d"]||keys["arrowright"])x+=1;

const length=Math.hypot(x,z);
if(length>1){x/=length;z/=length;}

player.position.x+=x*speed*delta;
player.position.z+=z*speed*delta;

if(length>0.1){
player.rotation.y=Math.atan2(x,z);
}

if(dashPower>0){
player.position.x+=Math.sin(player.rotation.y)*25*delta;
player.position.z+=Math.cos(player.rotation.y)*25*delta;
dashPower-=delta;
}

player.position.x=THREE.MathUtils.clamp(player.position.x,-20,20);
player.position.z=THREE.MathUtils.clamp(player.position.z,-20,20);

enemies.forEach(enemy=>{
const dx=player.position.x-enemy.position.x;
const dz=player.position.z-enemy.position.z;
const distance=Math.hypot(dx,dz);

if(distance>0.8){
enemy.position.x+=(dx/distance)*1.8*timeScale*delta;
enemy.position.z+=(dz/distance)*1.8*timeScale*delta;
}
enemy.rotation.y+=delta*2;
enemy.position.y=0.8+Math.sin(time*0.003+enemy.id)*0.15;

if(distance<1.2&&hitCooldown<=0){
health-=10;
hitCooldown=0.6;
document.getElementById("healthbar").style.width=health+"%";
if(health<=0){
running=false;
document.getElementById("message").style.display="block";
}
}
});

if(hitCooldown>0)hitCooldown-=delta;

camera.position.x+=(player.position.x-camera.position.x)*delta*4;
camera.position.z+=(player.position.z+11-camera.position.z)*delta*4;
camera.position.y=8;
camera.lookAt(player.position.x,0,player.position.z);
}

renderer.render(scene,camera);
}
requestAnimationFrame(animate);

window.addEventListener("resize",()=>{
camera.aspect=innerWidth/innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
