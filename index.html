
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>SANDEVISTAN 3.0</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#030914;color:white;font-family:Arial;touch-action:none}
canvas{display:block}
button{border:2px solid #43f4ff;background:#071d2c;color:#43f4ff;border-radius:12px;padding:13px;font-weight:bold;touch-action:none}
#menu,#gameover{position:fixed;inset:0;z-index:10;background:radial-gradient(circle,#12334a,#030914 75%);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:20px}
#menu h1{font-size:clamp(35px,9vw,58px);letter-spacing:5px;color:#43f4ff;text-shadow:0 0 25px #00dfff}
#menu p{color:#b5dce8;line-height:1.7}
#hud{position:fixed;top:14px;left:14px;z-index:4;pointer-events:none;font-size:12px}
.bar{width:155px;height:9px;background:#283442;border-radius:8px;margin:5px 0 9px;overflow:hidden}
.fill{height:100%;width:100%;background:#43f4ff;box-shadow:0 0 12px currentColor}
#hp{background:#43f4ff}
#psy{background:#ff286d;width:0}
#bossbar{position:fixed;top:85px;left:50%;transform:translateX(-50%);width:65%;display:none;z-index:4;text-align:center;font-size:11px;color:#ff557e;pointer-events:none}
#bossbar .bar{width:100%;height:12px}
#bossfill{background:#ff174f}
#topright{position:fixed;right:14px;top:14px;text-align:right;z-index:4;color:#43f4ff;font-size:12px;pointer-events:none}
#slowFX{position:fixed;inset:0;z-index:3;pointer-events:none;opacity:0;transition:opacity .15s;background:radial-gradient(circle,transparent 25%,#00dfff55 100%),repeating-linear-gradient(110deg,transparent 0 35px,#43f4ff24 36px 39px)}
#slowFX.on{opacity:1}
#psyFX{position:fixed;inset:0;z-index:3;pointer-events:none;opacity:0;transition:opacity .2s;background:radial-gradient(circle,transparent 20%,#ff003b66 100%);mix-blend-mode:screen}
#psyFX.on{opacity:1}
#controls{position:fixed;bottom:18px;left:0;right:0;z-index:6;display:flex;justify-content:space-between;align-items:end;padding:0 13px}
#joy{width:105px;height:105px;border:2px solid #43f4ff88;border-radius:50%;position:relative;background:#00dfff14;touch-action:none}
#stick{width:42px;height:42px;position:absolute;left:30px;top:30px;border-radius:50%;background:#43f4ff88;border:2px solid #43f4ff}
#actions{display:flex;gap:6px;align-items:end}
.action{width:65px;height:65px;border-radius:50%;padding:3px;font-size:10px}
#dash{border-color:#ff286d;color:#ff8eae}
#pulse{border-color:#e7a4ff;color:#e7a4ff}
#cyber{border-color:#ff174f;color:#ff7795}
#gameover{display:none}
#gameover h1{color:#ff286d}
@media(min-width:700px){#controls{padding:0 35px}#joy{width:120px;height:120px}#stick{left:37px;top:37px}}
</style>
</head>
<body>

<div id="menu">
<h1>SANDEVISTAN</h1>
<p>PROTOCOLO DE COMBATE 3.0<br>
DRONES ARASAKA · WAVES · ADAM SMASHER</p>
<button id="start">INICIAR SIMULAÇÃO</button>
<p style="font-size:11px">SOBREVIVA ATÉ A WAVE 20.</p>
</div>

<div id="hud">
<div>INTEGRIDADE</div>
<div class="bar"><div class="fill" id="hp"></div></div>
<div>CYBERPSICOSE</div>
<div class="bar"><div class="fill" id="psy"></div></div>
<div id="wave">WAVE 1</div>
<div id="enemiesLeft">ALVOS: 0</div>
</div>

<div id="topright">IMPLANTE ONLINE</div>
<div id="bossbar">
ADAM SMASHER
<div class="bar"><div class="fill" id="bossfill"></div></div>
</div>

<div id="slowFX"></div>
<div id="psyFX"></div>

<div id="controls">
<div id="joy"><div id="stick"></div></div>
<div id="actions">
<button class="action" id="dash">DASH</button>
<button class="action" id="pulse">PULSO</button>
<button class="action" id="slow">SLOW</button>
<button class="action" id="cyber">CYBER</button>
</div>
</div>

<div id="gameover">
<h1>SISTEMA CRÍTICO</h1>
<p id="result">Você foi derrotado.</p>
<button onclick="location.reload()">REINICIAR</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=>{
'use strict';

if(!window.THREE){
document.querySelector('#menu p').textContent='ERRO DE CONEXÃO: NÃO FOI POSSÍVEL CARREGAR O MOTOR 3D.';
return;
}

// CENA
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x030914);
scene.fog=new THREE.FogExp2(0x07111e,.017);

const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,120);
camera.position.set(0,8,12);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.15;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0x9eeeff,0x101326,1.6));

const sunlight=new THREE.DirectionalLight(0x9befff,2);
sunlight.position.set(-7,14,8);
sunlight.castShadow=true;
sunlight.shadow.mapSize.set(1024,1024);
scene.add(sunlight);

const pinkLight=new THREE.PointLight(0xff145e,25,25);
pinkLight.position.set(7,4,-7);
scene.add(pinkLight);

const blueLight=new THREE.PointLight(0x00cfff,20,25);
blueLight.position.set(-8,3,6);
scene.add(blueLight);

// ARENA
const floor=new THREE.Mesh(
new THREE.PlaneGeometry(100,100),
new THREE.MeshStandardMaterial({
color:0x101d2b,metalness:.45,roughness:.7
}));
floor.rotation.x=-Math.PI/2;
floor.receiveShadow=true;
scene.add(floor);

const grid=new THREE.GridHelper(80,60,0x00bcd4,0x18374a);
grid.position.y=.02;
scene.add(grid);

const ring=new THREE.Mesh(
new THREE.TorusGeometry(18,.09,8,100),
new THREE.MeshBasicMaterial({color:0x00dfff})
);
ring.rotation.x=Math.PI/2;
ring.position.y=.08;
scene.add(ring);

for(let i=0;i<16;i++){
const a=i/16*Math.PI*2;
const pillar=new THREE.Mesh(
new THREE.BoxGeometry(.22,2.5,.22),
new THREE.MeshStandardMaterial({
color:0x087c99,
emissive:0x003b55
}));
pillar.position.set(Math.cos(a)*18,1.25,Math.sin(a)*18);
scene.add(pillar);
}

// JOGADOR
const player=new THREE.Group();
scene.add(player);

const body=new THREE.Mesh(
new THREE.CylinderGeometry(.38,.38,1.1,16),
new THREE.MeshStandardMaterial({
color:0x12bcd5,
metalness:.65,
roughness:.24,
emissive:0x003b50
}));
body.position.y=1.05;
body.castShadow=true;
player.add(body);

const head=new THREE.Mesh(
new THREE.SphereGeometry(.27,18,14),
new THREE.MeshStandardMaterial({
color:0x101b2a,
metalness:.6
}));
head.position.y=1.77;
player.add(head);

const visor=new THREE.Mesh(
new THREE.BoxGeometry(.36,.09,.12),
new THREE.MeshBasicMaterial({color:0x65f7ff})
);
visor.position.set(0,1.8,-.22);
player.add(visor);

const aura=new THREE.Mesh(
new THREE.TorusGeometry(.58,.035,8,40),
new THREE.MeshBasicMaterial({color:0x00eaff})
);
aura.rotation.x=Math.PI/2;
aura.position.y=.08;
player.add(aura);

// ESTADO DO JOGO
let running=false;
let health=100;
let psychosis=0;
let slow=false;
let cyber=false;
let cyberTime=0;
let dashTime=0;
let dashCooldown=0;
let pulseCooldown=0;
let hitTimer=0;
let wave=1;
let boss=null;
let enemies=[];
let particles=[];
let trails=[];
let joyX=0,joyY=0;
let joyOn=false;
let last=0;

// DRONES ARASAKA
function createDrone(x,z){
const group=new THREE.Group();

const shell=new THREE.Mesh(
new THREE.IcosahedronGeometry(.58,2),
new THREE.MeshStandardMaterial({
color:0xd92b65,
metalness:.55,
roughness:.25,
emissive:0x59001c
}));
shell.castShadow=true;
group.add(shell);

const eye=new THREE.Mesh(
new THREE.SphereGeometry(.18,12,12),
new THREE.MeshBasicMaterial({color:0xffb9d5})
);
eye.position.set(0,0,-.53);
group.add(eye);

const glow=new THREE.PointLight(0xff174f,1.5,4);
group.add(glow);

group.position.set(x,.9,z);
scene.add(group);

return {
mesh:group,
hp:30+wave*4,
maxHp:30+wave*4,
speed:1.5+Math.min(wave*.06,1.5),
attack:7+Math.floor(wave*.3),
cooldown:Math.random()
};
}

// ADAM SMASHER
function createBoss(){
const group=new THREE.Group();
const metal=new THREE.MeshStandardMaterial({
color:0x414b59,
metalness:.9,
roughness:.22
});
const red=new THREE.MeshStandardMaterial({
color:0x8d123e,
metalness:.7,
emissive:0x370018
});

function part(geometry,material,x,y,z){
const m=new THREE.Mesh(geometry,material);
m.position.set(x,y,z);
m.castShadow=true;
group.add(m);
return m;
}

part(new THREE.BoxGeometry(1.6,2.2,1),metal,0,1.8,0);
part(new THREE.SphereGeometry(.55,16,12),red,0,3.2,0);
part(new THREE.BoxGeometry(1.9,.65,.8),metal,0,2.7,0);
part(new THREE.BoxGeometry(.22,.12,.1),new THREE.MeshBasicMaterial({color:0xff174f}),0,3.25,-.52);

part(new THREE.CylinderGeometry(.3,.4,1.2,10),metal,-.55,.55,0);
part(new THREE.CylinderGeometry(.3,.4,1.2,10),metal,.55,.55,0);

part(new THREE.BoxGeometry(.55,1.5,.6),metal,-1.05,1.9,0);
part(new THREE.BoxGeometry(.55,1.5,.6),metal,1.05,1.9,0);

const light=new THREE.PointLight(0xff174f,5,9);
light.position.y=3;
group.add(light);

group.position.set(0,0,-11);
group.scale.set(1.6,1.6,1.6);
scene.add(group);

return {
mesh:group,
hp:1200,
maxHp:1200,
speed:1.25,
attack:18,
cooldown:1.5,
boss:true
};
}

// ONDAS
function spawnWave(){
enemies=[];
boss=null;

if(wave===20){
boss=createBoss();
$('bossbar').style.display='block';
$('bossfill').style.width='100%';
}else{
$('bossbar').style.display='none';

const count=Math.min(3+wave,16);

for(let i=0;i<count;i++){
const a=i/count*Math.PI*2;
const radius=9+Math.random()*4;
enemies.push(createDrone(
Math.cos(a)*radius,
Math.sin(a)*radius
));
}
}

updateHUD();
}

function updateHUD(){
$('wave').textContent='WAVE '+wave;
$('enemiesLeft').textContent='ALVOS: '+(boss?1:enemies.length);
}

// PARTÍCULAS
function burst(position,color,count=18){
for(let i=0;i<count;i++){
const mesh=new THREE.Mesh(
new THREE.SphereGeometry(.055,6,6),
new THREE.MeshBasicMaterial({color,transparent:true})
);
mesh.position.copy(position);
scene.add(mesh);

particles.push({
mesh,
velocity:new THREE.Vector3(
(Math.random()-.5)*6,
Math.random()*5,
(Math.random()-.5)*6
),
life:.8
});
}
}

// RASTROS
function createTrail(){
const mesh=new THREE.Mesh(
new THREE.CylinderGeometry(.12,.24,1.5,8,1,true),
new THREE.MeshBasicMaterial({
color:0x00eaff,
transparent:true,
opacity:.35,
side:THREE.DoubleSide
})
);
mesh.position.copy(player.position);
mesh.position.y=1;
mesh.rotation.z=Math.PI/2;
scene.add(mesh);
trails.push({mesh,life:.3});
}

// ATAQUE DE PULSO
function pulseAttack(){
if(!running||pulseCooldown>0)return;
pulseCooldown=1.2;

const radius=5;
burst(player.position.clone().add(new THREE.Vector3(0,1,0)),0x66faff,35);

for(const e of enemies){
if(e.mesh.position.distanceTo(player.position)<radius){
e.hp-=45;
burst(e.mesh.position,0xff286d,8);
}
}

if(boss&&boss.mesh.position.distanceTo(player.position)<radius+2){
boss.hp-=35;
burst(boss.mesh.position,0xff286d,12);
}
}

// CONTROLES
$('start').onclick=()=>{
running=true;
$('menu').style.display='none';
spawnWave();
};

function setSlow(v){
slow=v&&running;
$('slow').style.background=slow?'#07556a':'#071d2c';
$('slowFX').classList.toggle('on',slow);
$('topright').textContent=slow?'SANDEVISTAN ATIVO':'IMPLANTE ONLINE';
}

$('slow').addEventListener('pointerdown',e=>{
e.preventDefault();
setSlow(true);
});
['pointerup','pointercancel','pointerleave'].forEach(ev=>{
$('slow').addEventListener(ev,()=>setSlow(false));
});

$('dash').addEventListener('pointerdown',e=>{
e.preventDefault();
if(running&&dashCooldown<=0){
dashTime=.22;
dashCooldown=1;
burst(player.position.clone().add(new THREE.Vector3(0,1,0)),0x00eaff,15);
}
});

$('pulse').addEventListener('pointerdown',e=>{
e.preventDefault();
pulseAttack();
});

$('cyber').addEventListener('pointerdown',e=>{
e.preventDefault();
if(running&&psychosis>=100&&!cyber){
cyber=true;
cyberTime=6;
psychosis=0;
$('psyFX').classList.add('on');
}
});

// ANALÓGICO
const joy=$('joy');
const stick=$('stick');

function moveJoy(e){
const r=joy.getBoundingClientRect();
let x=e.clientX-r.left-r.width/2;
let y=e.clientY-r.top-r.height/2;
const len=Math.hypot(x,y);
const max=33;

if(len>max){x=x/len*max;y=y/len*max;}

joyX=x/max;
joyY=y/max;
stick.style.left=(30+x)+'px';
stick.style.top=(30+y)+'px';
}

function releaseJoy(){
joyOn=false;
joyX=joyY=0;
stick.style.left='30px';
stick.style.top='30px';
}

joy.addEventListener('pointerdown',e=>{
joyOn=true;
joy.setPointerCapture(e.pointerId);
moveJoy(e);
});
joy.addEventListener('pointermove',e=>{
if(joyOn)moveJoy(e);
});
joy.addEventListener('pointerup',releaseJoy);
joy.addEventListener('pointercancel',releaseJoy);

// TECLADO
const keys={};
addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);

// MORTE
function gameOver(){
running=false;
setSlow(false);
$('result').textContent='Você chegou à wave '+wave+'.';
$('gameover').style.display='flex';
}

// LOOP PRINCIPAL
function animate(time){
requestAnimationFrame(animate);

const dt=Math.min((time-last)/1000,.04)||0;
last=time;

if(running){

const enemyScale=slow?.12:1;

let x=joyX,z=joyY;
if(keys.w||keys.arrowup)z-=1;
if(keys.s||keys.arrowdown)z+=1;
if(keys.a||keys.arrowleft)x-=1;
if(keys.d||keys.arrowright)x+=1;

const len=Math.hypot(x,z);
if(len>1){x/=len;z/=len;}

// MOVIMENTO DO JOGADOR
const speed=dashTime>0?25:6.5;
player.position.x+=x*speed*dt;
player.position.z+=z*speed*dt;

player.position.x=THREE.MathUtils.clamp(player.position.x,-16,16);
player.position.z=THREE.MathUtils.clamp(player.position.z,-16,16);

if(len>.1)player.rotation.y=Math.atan2(x,z);

if(dashTime>0){
dashTime-=dt;
trailTimer-=dt;
if(trailTimer<=0){createTrail();trailTimer=.03;}
}

dashCooldown=Math.max(0,dashCooldown-dt);
pulseCooldown=Math.max(0,pulseCooldown-dt);
hitTimer=Math.max(0,hitTimer-dt);

// CYBERPSICOSE
if(cyber){
cyberTime-=dt;
if(cyberTime<=0){
cyber=false;
$('psyFX').classList.remove('on');
}
}

$('psy').style.width=psychosis+'%';
$('cyber').style.opacity=psychosis>=100?'1':'.45';

// INIMIGOS
const all=[...enemies];
if(boss)all.push(boss);

for(const e of all){
const m=e.mesh;
const dx=player.position.x-m.position.x;
const dz=player.position.z-m.position.z;
const distance=Math.hypot(dx,dz);

if(distance>1.3){
m.position.x+=dx/distance*e.speed*enemyScale*dt;
m.position.z+=dz/distance*e.speed*enemyScale*dt;
}

m.rotation.y+=dt*(slow?.2:1.5);

if(distance<1.65&&e.cooldown<=0){
if(hitTimer<=0){
health=Math.max(0,health-e.attack);
$('hp').style.width=health+'%';
psychosis=Math.min(100,psychosis+12);
hitTimer=.5;
}
e.cooldown=1.1;
}
e.cooldown-=dt*enemyScale;
}

// MORTE
if(health<=0)gameOver();

// REMOVER DRONES DESTRUÍDOS
for(let i=enemies.length-1;i>=0;i--){
if(enemies[i].hp<=0){
burst(enemies[i].mesh.position,0xff286d,25);
scene.remove(enemies[i].mesh);
enemies.splice(i,1);
psychosis=Math.min(100,psychosis+9);
}
}

// CHEFE
if(boss){
$('bossfill').style.width=Math.max(0,boss.hp/boss.maxHp*100)+'%';

if(boss.hp<=0){
burst(boss.mesh.position,0xff286d,60);
scene.remove(boss.mesh);
boss=null;
$('bossbar').style.display='none';
wave=21;
$('wave').textContent='ADAM SMASHER DERROTADO!';
}
}

updateHUD();

// PRÓXIMA WAVE
if(!boss&&enemies.length===0&&wave<20){
wave++;
spawnWave();
}

// CÂMERA
camera.position.x+=(player.position.x-camera.position.x)*Math.min(1,dt*3);
camera.position.z+=(player.position.z+11-camera.position.z)*Math.min(1,dt*3);
camera.lookAt(player.position.x,.6,player.position.z);

aura.rotation.z+=dt*2;
}

// PARTÍCULAS
for(let i=particles.length-1;i>=0;i--){
const p=particles[i];
p.life-=dt;
p.mesh.position.addScaledVector(p.velocity,dt);
p.velocity.y-=5*dt;
p.mesh.material.opacity=Math.max(0,p.life/.8);

if(p.life<=0){
scene.remove(p.mesh);
p.mesh.geometry.dispose();
p.mesh.material.dispose();
particles.splice(i,1);
}
}

// RASTROS
for(let i=trails.length-1;i>=0;i--){
const p=trails[i];
p.life-=dt;
p.mesh.material.opacity=Math.max(0,p.life/.3)*.35;

if(p.life<=0){
scene.remove(p.mesh);
p.mesh.geometry.dispose();
p.mesh.material.dispose();
trails.splice(i,1);
}
}

renderer.render(scene,camera);
}

requestAnimationFrame(animate);

addEventListener('resize',()=>{
camera.aspect=innerWidth/innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
});

})();
</script>
</body>
  </html>
