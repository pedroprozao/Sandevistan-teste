
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>SANDEVISTAN 2.0</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#030914;color:white;font-family:Arial;touch-action:none}
canvas{display:block}
#menu{position:fixed;inset:0;z-index:10;background:radial-gradient(circle,#12334a,#030914 70%);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
h1{font-size:clamp(35px,9vw,58px);color:#43f4ff;letter-spacing:6px;text-shadow:0 0 25px #00dfff}
#menu p{color:#b5dce8;letter-spacing:2px}
button{background:#082638;color:#43f4ff;border:2px solid #43f4ff;border-radius:12px;padding:15px 22px;font-weight:bold;font-size:15px;touch-action:none}
button:active{background:#08718a}
#hud{position:fixed;top:15px;left:15px;z-index:3;pointer-events:none}
#healthbox{width:150px;height:9px;background:#333;margin-top:8px;border-radius:10px;overflow:hidden}
#health{height:100%;width:100%;background:#43f4ff;box-shadow:0 0 12px #00dfff}
#status{position:fixed;right:15px;top:15px;color:#43f4ff;font-size:12px;z-index:3}
#slowFX{position:fixed;inset:0;z-index:2;pointer-events:none;opacity:0;transition:.15s;background:radial-gradient(circle,transparent 30%,#00dfff35 100%),repeating-linear-gradient(110deg,transparent 0 35px,#43f4ff16 36px 38px)}
#slowFX.on{opacity:1}
#controls{position:fixed;bottom:20px;left:0;right:0;z-index:5;display:flex;justify-content:space-between;align-items:end;padding:0 18px}
#joy{width:115px;height:115px;border:2px solid #43f4ff77;border-radius:50%;background:#00dfff15;position:relative;touch-action:none}
#stick{position:absolute;width:43px;height:43px;left:34px;top:34px;border-radius:50%;background:#43f4ff88;border:2px solid #43f4ff}
#actions{display:flex;gap:10px}
.action{width:75px;height:75px;border-radius:50%;padding:4px;font-size:12px}
#dash{border-color:#ff286d;color:#ff8eae}
#message{position:fixed;inset:0;z-index:9;background:#030914eF;display:none;flex-direction:column;justify-content:center;align-items:center}
#message h2{color:#ff286d}
</style>
</head>
<body>

<div id="menu">
<h1>SANDEVISTAN</h1>
<p>PROTOCOLO DE COMBATE 2.0</p>
<button id="start">INICIAR SIMULAÇÃO</button>
<p style="font-size:11px;line-height:1.8;margin-top:25px">
ANALÓGICO: MOVIMENTAR<br>
SLOW: DESACELERAR INIMIGOS<br>
DASH: AVANÇO RÁPIDO
</p>
</div>

<div id="hud">
<div>SANDEVISTAN 2.0</div>
<div style="font-size:11px;margin-top:8px">INTEGRIDADE</div>
<div id="healthbox"><div id="health"></div></div>
</div>
<div id="status">IMPLANTE ONLINE</div>
<div id="slowFX"></div>

<div id="controls">
<div id="joy"><div id="stick"></div></div>
<div id="actions">
<button class="action" id="dash">DASH</button>
<button class="action" id="slow">SLOW</button>
</div>
</div>

<div id="message">
<h2>SISTEMA CRÍTICO</h2>
<p>Você foi derrotado.</p>
<button onclick="location.reload()">REINICIAR</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
if(!window.THREE){
document.querySelector("#menu p").textContent="ERRO AO CARREGAR O MOTOR 3D. VERIFIQUE A INTERNET.";
return;
}

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x030914);
scene.fog=new THREE.FogExp2(0x07111e,.018);

const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,120);
camera.position.set(0,8,12);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.15;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0x9eeeff,0x101326,1.6));

const light=new THREE.DirectionalLight(0x9befff,2);
light.position.set(-7,14,8);
light.castShadow=true;
light.shadow.mapSize.set(1024,1024);
scene.add(light);

const pinkLight=new THREE.PointLight(0xff145e,25,25);
pinkLight.position.set(7,4,-7);
scene.add(pinkLight);

const cyanLight=new THREE.PointLight(0x00cfff,20,25);
cyanLight.position.set(-8,3,6);
scene.add(cyanLight);

// ARENA
const floor=new THREE.Mesh(
new THREE.PlaneGeometry(100,100),
new THREE.MeshStandardMaterial({
color:0x101d2b,metalness:.45,roughness:.7
}));
floor.rotation.x=-Math.PI/2;
floor.receiveShadow=true;
scene.add(floor);

const grid=new THREE.GridHelper(80,60,0x00bcd4,0x18374a);
grid.position.y=.02;
scene.add(grid);

const ring=new THREE.Mesh(
new THREE.TorusGeometry(18,.09,8,100),
new THREE.MeshBasicMaterial({color:0x00dfff})
);
ring.rotation.x=Math.PI/2;
ring.position.y=.08;
scene.add(ring);

// PILARES
for(let i=0;i<16;i++){
const a=i/16*Math.PI*2;
const pillar=new THREE.Mesh(
new THREE.BoxGeometry(.22,2.5,.22),
new THREE.MeshStandardMaterial({
color:0x087c99,
emissive:0x003b55,
metalness:.5
}));
pillar.position.set(Math.cos(a)*18,1.25,Math.sin(a)*18);
pillar.castShadow=true;
scene.add(pillar);
}

// JOGADOR
const player=new THREE.Group();
scene.add(player);

const body=new THREE.Mesh(
new THREE.CylinderGeometry(.38,.38,1.1,16),
new THREE.MeshStandardMaterial({
color:0x12bcd5,
metalness:.65,
roughness:.24,
emissive:0x003b50
}));
body.position.y=1.05;
body.castShadow=true;
player.add(body);

const head=new THREE.Mesh(
new THREE.SphereGeometry(.27,18,14),
new THREE.MeshStandardMaterial({
color:0x101b2a,
metalness:.6,
roughness:.3
}));
head.position.y=1.77;
player.add(head);

const visor=new THREE.Mesh(
new THREE.BoxGeometry(.36,.09,.12),
new THREE.MeshBasicMaterial({color:0x65f7ff})
);
visor.position.set(0,1.8,-.22);
player.add(visor);

const aura=new THREE.Mesh(
new THREE.TorusGeometry(.58,.035,8,40),
new THREE.MeshBasicMaterial({color:0x00eaff})
);
aura.rotation.x=Math.PI/2;
aura.position.y=.08;
player.add(aura);

// INIMIGOS
const enemies=[];
const enemyMaterial=new THREE.MeshStandardMaterial({
color:0xe91e55,
metalness:.35,
roughness:.28,
emissive:0x59001c
});

for(let i=0;i<5;i++){
const enemy=new THREE.Group();

const core=new THREE.Mesh(
new THREE.IcosahedronGeometry(.62,1),
enemyMaterial
);
core.castShadow=true;
enemy.add(core);

const eye=new THREE.Mesh(
new THREE.BoxGeometry(.4,.09,.08),
new THREE.MeshBasicMaterial({color:0xffb3ce})
);
eye.position.set(0,.12,-.52);
enemy.add(eye);

const a=i*Math.PI*2/5;
enemy.position.set(Math.cos(a)*10,.9,Math.sin(a)*10);
scene.add(enemy);
enemies.push(enemy);
}

// PARTÍCULAS
const particles=[];
function burst(position,color,count=16){
for(let i=0;i<count;i++){
const mesh=new THREE.Mesh(
new THREE.SphereGeometry(.045,6,6),
new THREE.MeshBasicMaterial({color,transparent:true})
);
mesh.position.copy(position);
scene.add(mesh);

particles.push({
mesh,
velocity:new THREE.Vector3(
(Math.random()-.5)*5,
Math.random()*4,
(Math.random()-.5)*5
),
life:.65
});
}
}

// RASTROS DO DASH
const trails=[];
function createTrail(){
const mesh=new THREE.Mesh(
new THREE.CylinderGeometry(.12,.24,1.5,8,1,true),
new THREE.MeshBasicMaterial({
color:0x00eaff,
transparent:true,
opacity:.3,
side:THREE.DoubleSide
})
);
mesh.position.copy(player.position);
mesh.position.y=1;
mesh.rotation.z=Math.PI/2;
scene.add(mesh);
trails.push({mesh,life:.22});
}

// ESTADO
let running=false;
let health=100;
let slow=false;
let dashTime=0;
let dashCooldown=0;
let hitTimer=0;
let trailTimer=0;
let joyX=0,joyY=0,last=0;

document.querySelector("#start").onclick=()=>{
running=true;
document.querySelector("#menu").style.display="none";
};

const slowButton=document.querySelector("#slow");

function setSlow(value){
slow=value&&running;
slowButton.style.background=slow?"#07556a":"#082638";
document.querySelector("#slowFX").classList.toggle("on",slow);
document.querySelector("#status").textContent=
slow?"TEMPO REDUZIDO":"IMPLANTE ONLINE";
}

slowButton.addEventListener("pointerdown",e=>{
e.preventDefault();
setSlow(true);
});

["pointerup","pointercancel","pointerleave"].forEach(event=>{
slowButton.addEventListener(event,()=>setSlow(false));
});

document.querySelector("#dash").addEventListener("pointerdown",e=>{
e.preventDefault();
if(running&&dashCooldown<=0){
dashTime=.18;
dashCooldown=1.1;
burst(player.position.clone().add(new THREE.Vector3(0,1,0)),0x00eaff,12);
}
});

// ANALÓGICO
const joy=document.querySelector("#joy");
const stick=document.querySelector("#stick");
let joyOn=false;

function moveJoy(e){
const rect=joy.getBoundingClientRect();
let x=e.clientX-rect.left-rect.width/2;
let y=e.clientY-rect.top-rect.height/2;
const length=Math.hypot(x,y);
const max=35;

if(length>max){
x=x/length*max;
y=y/length*max;
}

joyX=x/max;
joyY=y/max;
stick.style.left=(34+x)+"px";
stick.style.top=(34+y)+"px";
}

function releaseJoy(){
joyOn=false;
joyX=joyY=0;
stick.style.left="34px";
stick.style.top="34px";
}

joy.addEventListener("pointerdown",e=>{
joyOn=true;
joy.setPointerCapture(e.pointerId);
moveJoy(e);
});

joy.addEventListener("pointermove",e=>{
if(joyOn)moveJoy(e);
});

joy.addEventListener("pointerup",releaseJoy);
joy.addEventListener("pointercancel",releaseJoy);

// TECLADO
const keys={};
addEventListener("keydown",e=>keys[e.key.toLowerCase()]=true);
addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);

// LOOP
function animate(time){
requestAnimationFrame(animate);

const dt=Math.min((time-last)/1000,.04)||0;
last=time;

if(running){

// SLOW AFETA SOMENTE OS INIMIGOS!
const enemySpeed=slow?.13:1;

let x=joyX;
let z=joyY;

if(keys.w||keys.arrowup)z-=1;
if(keys.s||keys.arrowdown)z+=1;
if(keys.a||keys.arrowleft)x-=1;
if(keys.d||keys.arrowright)x+=1;

const length=Math.hypot(x,z);
if(length>1){x/=length;z/=length;}

// JOGADOR NÃO FICA LENTO NO SLOW
const speed=dashTime>0?24:6.2;

player.position.x+=x*speed*dt;
player.position.z+=z*speed*dt;

player.position.x=THREE.MathUtils.clamp(player.position.x,-16.5,16.5);
player.position.z=THREE.MathUtils.clamp(player.position.z,-16.5,16.5);

if(length>.1){
player.rotation.y=Math.atan2(x,z);
}

// DASH
if(dashTime>0){
dashTime-=dt;
trailTimer-=dt;

if(trailTimer<=0){
createTrail();
trailTimer=.035;
}
}

dashCooldown=Math.max(0,dashCooldown-dt);
hitTimer=Math.max(0,hitTimer-dt);

// INIMIGOS
for(const enemy of enemies){

const dx=player.position.x-enemy.position.x;
const dz=player.position.z-enemy.position.z;
const distance=Math.hypot(dx,dz);

if(distance>.95){
enemy.position.x+=(dx/distance)*2*enemySpeed*dt;
enemy.position.z+=(dz/distance)*2*enemySpeed*dt;
}

enemy.rotation.y+=dt*(slow?.25:1.8);
enemy.rotation.x=Math.sin(time*.002)*.18;

if(distance<1.25&&hitTimer<=0){
health=Math.max(0,health-8);
document.querySelector("#health").style.width=health+"%";
hitTimer=.55;

if(health<=0){
running=false;
setSlow(false);
document.querySelector("#message").style.display="flex";
}
}
}

// CÂMERA
camera.position.x+=(player.position.x-camera.position.x)*Math.min(1,dt*3);
camera.position.z+=(player.position.z+11-camera.position.z)*Math.min(1,dt*3);
camera.lookAt(player.position.x,.6,player.position.z);

aura.rotation.z+=dt*2;
}

// ATUALIZA PARTÍCULAS
for(let i=particles.length-1;i>=0;i--){
const p=particles[i];
p.life-=dt;
p.mesh.position.addScaledVector(p.velocity,dt);
p.velocity.y-=5*dt;
p.mesh.material.opacity=Math.max(0,p.life/.65);

if(p.life<=0){
scene.remove(p.mesh);
p.mesh.geometry.dispose();
p.mesh.material.dispose();
particles.splice(i,1);
}
}

// ATUALIZA RASTROS
for(let i=trails.length-1;i>=0;i--){
const p=trails[i];
p.life-=dt;
p.mesh.material.opacity=Math.max(0,p.life/.22)*.3;

if(p.life<=0){
scene.remove(p.mesh);
p.mesh.geometry.dispose();
p.mesh.material.dispose();
trails.splice(i,1);
}
}

renderer.render(scene,camera);
}

requestAnimationFrame(animate);

// REDIMENSIONAMENTO
addEventListener("resize",()=>{
camera.aspect=innerWidth/innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
});

})();
</script>
</body>
</html>
